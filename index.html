  <h1>Trace</h1>
  <p>Photo Frame은 Google 드라이브에 저장된 내 사진을 전체 화면 슬라이드쇼로 보여주는 개인용 디지털 액자 앱입니다.</p>
  <ul>
    <li>Google 계정으로 로그인하면 드라이브의 사진을 <b>읽기 전용</b>으로 불러옵니다.</li>
    <li>사진을 수정·삭제·업로드하지 않습니다.</li>
    <li>앱은 사용자의 컴퓨터에서 실행되며, 데이터는 그 컴퓨터에만 저장됩니다.</li>
  </ul>
